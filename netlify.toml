[build]
  command = "npm run build"
  publish = "dist"
  # Serverless functions (speech token, AI coach) arrive in later phases.
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  # transformers.js pulls in onnxruntime-node, which only Node uses; skip its large GPU download.
  ONNXRUNTIME_NODE_INSTALL = "skip"

# Basic hardening for every page: no MIME sniffing, no framing by other sites, mic limited to this app.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self), camera=(), geolocation=()"

# The service worker must never be cached, or app updates won't reach installed phones.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


# Built-in practice audio: personal practice copies, kept out of search engines.
[[headers]]
  for = "/audio/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Clip files never change in place; the clip list and transcripts can, so phones must recheck them.
[[headers]]
  for = "/audio/clips/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/audio/clips.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/audio/transcripts/*"
  [headers.values]
    Cache-Control = "no-cache"